# ======================================================================================
# Project metadata
# ======================================================================================
[project]
name = "optimagic-rust"
description = "Experimental Rust implementations of low-level components for numerical optimizers."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]
# maturin takes the version from crates/optimagic-rust-py/Cargo.toml, which inherits it
# from the workspace Cargo.toml.
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "nonlinear optimization",
    "optimization",
    "line search",
    "trust region",
    "rust",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
authors = [
    { name = "Janos Gabler", email = "janos.gabler@gmail.com" },
]
maintainers = [
    { name = "Janos Gabler", email = "janos.gabler@gmail.com" },
]

[project.urls]
Repository = "https://github.com/optimagic-dev/optimagic-rust"
Github = "https://github.com/optimagic-dev/optimagic-rust"
Tracker = "https://github.com/optimagic-dev/optimagic-rust/issues"


# ======================================================================================
# Build system configuration
# ======================================================================================
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
# The crate with the PyO3 bindings.
manifest-path = "crates/optimagic-rust-py/Cargo.toml"
# Pure Python part of the package (python/optimagic_rust/).
python-source = "python"
# The compiled extension becomes the submodule optimagic_rust._core.
module-name = "optimagic_rust._core"
# Ship the tests in the sdist, so the conda-forge recipe can run them.
include = [{ path = "tests/**/*.py", format = "sdist" }]


# ======================================================================================
# Ruff configuration
# ======================================================================================
[tool.ruff]
target-version = "py312"
fix = true
# Lets the import sorter recognize optimagic_rust as first-party code.
src = ["python"]

[tool.ruff.lint]
select = [
  # isort
  "I",
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # pylint
  "PLE", "PLR", "PLW",
  # misc lints
  "PIE",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # pydocstyle
  "D",
  # flake8-annotations: require type annotations on all function signatures
  "ANN",
]

extend-ignore = [
  # Missing docstrings — not enforced for now
  "D100",  # public module
  "D101",  # public class
  "D102",  # public method
  "D103",  # public function
  "D104",  # public package
  "D105",  # magic method
  "D107",  # __init__
  # Docstring content/style rules — too noisy to enforce for now
  "D205",  # blank line between summary and description
  "D414",  # section has no body
  "D415",  # first line punctuation
  "D417",  # missing argument descriptions
  # do not assign a lambda expression, use a def
  "E731",
  # Too many arguments to function call
  "PLR0913",
  # Too many positional arguments
  "PLR0917",
  # Magic number
  "PLR2004",
  # Incompatible with formatting
  "ISC001",
  # Dynamically typed expressions (typing.Any) are disallowed
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
# Like mypy, allow omitting `-> None` on `__init__` if an argument is annotated.
mypy-init-return = true


# ======================================================================================
# Pytest configuration
# ======================================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# Turn warnings into errors, so they are noticed and fixed.
filterwarnings = ["error"]
xfail_strict = true


# ======================================================================================
# Misc configuration
# ======================================================================================
[tool.yamlfix]
line_length = 88
sequence_style = "block_style"
none_representation = "null"


# ======================================================================================
# Ty configuration
# ======================================================================================
[tool.ty.src]
include = ["python", "tests"]

[tool.ty.environment]
# Resolve `import optimagic_rust` to python/optimagic_rust, including the type stub
# _core.pyi of the compiled extension.
root = ["python"]


# ======================================================================================
# Pixi configuration
# ======================================================================================
# The Rust toolchain is NOT installed by pixi. It comes from rustup, which reads
# rust-toolchain.toml. See README.md.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# --- Base dependencies (all environments, except conda-build) -------------------------
[tool.pixi.dependencies]
python = ">=3.12,<3.15"
numpy = ">=2.0"
maturin = ">=1.16,<2"
# maturin develop uses pip to install the package into the environment.
pip = "*"

[tool.pixi.tasks]
develop = { cmd = "maturin develop", description = "Compile the Rust code (debug mode) and install optimagic-rust into the environment" }
develop-release = { cmd = "maturin develop --release", description = "Like develop, but with optimizations (for benchmarks)" }
tests-rust = { cmd = "cargo test --workspace", description = "Run the Rust unit tests and doctests" }
clippy = { cmd = "cargo clippy --workspace --all-targets -- -D warnings", description = "Lint the Rust code" }
docs-rust = { cmd = "cargo doc --workspace --no-deps --open", description = "Build the Rust API docs and open them in the browser" }
build-wheel = { cmd = "maturin build --release --out dist", description = "Build a wheel for this platform into dist/" }
build-sdist = { cmd = "maturin sdist --out dist", description = "Build a source distribution into dist/" }

# --- Python version features --------------------------------------------------------
[tool.pixi.feature.py312.dependencies]
python = "~=3.12.0"
[tool.pixi.feature.py313.dependencies]
python = "~=3.13.0"
[tool.pixi.feature.py314.dependencies]
python = "~=3.14.0"

# --- Feature: tests -----------------------------------------------------------------
[tool.pixi.feature.tests.dependencies]
pytest = ">=9"

[tool.pixi.feature.tests.tasks]
tests-python = { cmd = "pytest", depends-on = ["develop"], description = "Compile the Rust code and run the Python tests" }
tests = { depends-on = ["tests-rust", "tests-python"], description = "Run the Rust and the Python tests" }

# --- Feature: type-checking ---------------------------------------------------------
[tool.pixi.feature.type-checking.dependencies]
ty = ">=0.0.95,<0.0.96"
# Only used for stubtest, which checks the type stub against the compiled extension.
mypy = ">=2"
pytest = ">=9"

[tool.pixi.feature.type-checking.tasks]
ty = { cmd = "ty check", description = "Run ty type checker" }
ty-concise = { cmd = "ty check --output-format concise", description = "Run ty type checker with concise output" }
stubtest = { cmd = "python -m mypy.stubtest optimagic_rust._core", depends-on = ["develop"], description = "Check that _core.pyi matches the compiled extension" }

# --- Feature: conda-build -------------------------------------------------------------
[tool.pixi.feature.conda-build.dependencies]
rattler-build = ">=0.79"

[tool.pixi.feature.conda-build.tasks]
build-conda = { cmd = "rattler-build build --experimental --recipe recipe/recipe.yaml --output-dir output", description = "Build and test the conda package into output/" }

# --- Environments --------------------------------------------------------------------
[tool.pixi.environments]
# Default dev environment
default = { features = ["tests", "py314"], solve-group = "py314" }
# CI test environments
tests-py312 = { features = ["tests", "py312"], solve-group = "py312" }
tests-py313 = { features = ["tests", "py313"], solve-group = "py313" }
tests-py314 = { features = ["tests", "py314"], solve-group = "py314" }
# Type checking
type-checking = { features = ["type-checking", "py314"], solve-group = "py314" }
# Building the conda package (rattler-build brings its own Python and compilers)
conda-build = { features = ["conda-build"], no-default-feature = true }
