---
# Conda recipe for optimagic-rust, in the rattler-build (v1) format used by conda-forge.
#
# Build and test it locally with `pixi run -e conda-build build-conda`. The package
# lands in output/.
#
# The conda-forge recipe (in the optimagic-rust-feedstock repository, created once via
# conda-forge/staged-recipes) is this file with two changes: `source` points to the
# sdist on PyPI (url + sha256) and `version` is a literal string.
context:
  name: optimagic-rust
  version: ${{ load_from_file("Cargo.toml").workspace.package.version }}
package:
  name: ${{ name }}
  version: ${{ version }}
source:
  path: ..
  use_gitignore: true
build:
  number: 0
  script:
    # conda-forge requires shipping the licenses of all compiled-in Rust crates.
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.16,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.16,<2
    - pip
  run:
    - python
    - numpy >=1.26
tests:
  - python:
      imports:
        - optimagic_rust
      pip_check: true
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest
    script:
      - pytest tests
about:
  homepage: https://github.com/optimagic-dev/optimagic-rust
  repository: https://github.com/optimagic-dev/optimagic-rust
  summary: Experimental Rust components for numerical optimizers.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
extra:
  recipe-maintainers:
    - janosg
