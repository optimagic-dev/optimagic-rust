---
# Builds wheels for all supported platforms and the sdist, tests the wheels and, for
# tags starting with "v", publishes everything to PyPI.
#
# Adapted from the output of `maturin generate-ci github`. Because the extension is
# built against the stable ABI (abi3), one wheel per platform covers all Python
# versions >= 3.12.
name: release
permissions:
  contents: read
concurrency:
  group: release-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - '*'
  workflow_dispatch: null
jobs:
  build-wheels:
    name: Build wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - name: musllinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
          - name: windows-x64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ matrix.platform.name }}
          path: dist
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-sdist
          path: dist
  test-wheels:
    name: Test wheel ${{ matrix.platform.name }} py${{ matrix.python-version }}
    needs: build-wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux-x86_64
            runner: ubuntu-latest
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-latest
          - name: windows-x64
            runner: windows-latest
        python-version:
          - '3.12'
          - '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # yamllint disable-line rule:line-length
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-${{ matrix.platform.name }}
          path: dist
      # --only-binary makes sure the wheel is used; pip would otherwise silently fall
      # back to building from source if the wheel is incompatible.
      - name: Install wheel
        shell: bash
        run: >-
          python -m pip install --only-binary optimagic-rust --find-links dist
          optimagic-rust pytest
      # The source lives in python/optimagic_rust, which is not on sys.path, so the
      # tests import the installed wheel. The first command shows its location.
      - name: Run pytest
        shell: bash
        run: |
          python -c "import optimagic_rust; print(optimagic_rust.__file__)"
          python -m pytest
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-sdist
      - test-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/optimagic-rust/
    permissions:
      # Trusted publishing: PyPI accepts a short-lived token from GitHub instead of a
      # stored password. Requires a one-time setup on pypi.org, see README.md.
      id-token: write
    steps:
      - name: Download distributions
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls dist
          test -f "dist/optimagic_rust-${TAG#v}.tar.gz" || {
            echo "::error::Tag $TAG does not match the version in Cargo.toml."
            exit 1
          }
      - name: Publish distributions to PyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
